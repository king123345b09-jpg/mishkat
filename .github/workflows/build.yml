name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Permissions and services
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><application#' $M
          sed -i 's#</application>#<receiver android:name=".PrayerReceiver" android:exported="false"/><receiver android:name=".BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver><service android:name=".AdhanService" android:exported="false" android:foregroundServiceType="mediaPlayback"/></application>#' $M
      - name: Icons, Java and resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp -r resources/* android/app/src/main/res/ 2>/dev/null || true
          mkdir -p android/app/src/main/java/com/mishkat/anwar
          cp android-overrides/*.java android/app/src/main/java/com/mishkat/anwar/
          # نسخ ملفات الأذان من مجلد adhan إلى res/raw ليعمل بدون إنترنت
          if [ -d "adhan" ]; then cp adhan/*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true; fi
      - name: Mushaf pages
        run: |
          mkdir -p www/mushaf
          find . -name 'mushaf*.zip' -not -path './node_modules/*' -not -path './android/*' | while read z; do echo "unzip $z"; unzip -oq "$z" -d www/mushaf; done
          find . -name 'p[0-9][0-9][0-9].webp' -not -path './www/*' -not -path './node_modules/*' -not -path './android/*' -exec cp {} www/mushaf/ \;
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mishkat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
